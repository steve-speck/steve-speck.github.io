<head>
  <meta charset="utf-8">

  <title>Steve Speck</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2426;
      --muted: #5d676b;
      --accent: #1b5e7a;
      --bar: #1b3a4b;
      --bar-text: #f2f6f8;
      --line: #d9dfe2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12181b;
        --text: #e6eaec;
        --muted: #9aa7ad;
        --accent: #7cc3e0;
        --bar: #0b1114;
        --bar-text: #e6eaec;
        --line: #283237;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }
    nav { background: var(--bar); }
    nav ul {
      list-style: none; margin: 0 auto; padding: 0 1rem;
      max-width: 48rem; display: flex; flex-wrap: wrap;
    }
    nav a {
      display: block; padding: 0.9rem 1rem;
      color: var(--bar-text); text-decoration: none;
      font-family: system-ui, sans-serif; font-size: 0.95rem;
    }
    nav a:hover, nav a:focus-visible { background: rgba(255,255,255,0.12); outline: none; }
    main { max-width: 48rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    .intro { display: flex; gap: 2rem; align-items: flex-start; }
    .photo {
      width: 11rem; height: 11rem; flex: none;
      object-fit: cover; border-radius: 6px; border: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 2rem; line-height: 1.2; }
    .role { margin: 0.2rem 0 1rem; color: var(--muted); }
    h2 { font-size: 1.3rem; margin: 2.5rem 0 0.75rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); }
    p { margin: 0 0 1rem; }
    ul.list { padding-left: 1.2rem; margin: 0; }
    ul.list li { margin-bottom: 0.5rem; }
    a { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { max-width: 48rem; margin: 0 auto; padding: 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
    @media (max-width: 36rem) {
      .intro { flex-direction: column; }
      .photo { width: 9rem; height: 9rem; }
    }
  </style>
</head>
